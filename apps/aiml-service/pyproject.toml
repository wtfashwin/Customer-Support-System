[project]
name = "aiml-service"
version = "0.1.0"
description = "Python FastAPI AIML service: RAG, Azure DI, semantic search, agent routing."
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.2",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.3",
    "pgvector>=0.3.6",
    "langchain>=0.3.7",
    "langchain-openai>=0.2.5",
    "langchain-community>=0.3.5",
    "langchain-postgres>=0.0.12",
    "llama-index-core>=0.11.20",
    "llama-index-vector-stores-postgres>=0.2.6",
    "llama-index-embeddings-openai>=0.2.5",
    "openai>=1.54.0",
    "azure-ai-documentintelligence>=1.0.0",
    "azure-search-documents>=11.5.2",
    "azure-identity>=1.19.0",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "redis>=5.2.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "websockets>=13.1",
    "langgraph>=1.1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "locust>=2.32.2",
    "ruff>=0.7.2",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "testcontainers[postgres]>=4.8.2",
    "freezegun>=1.5.1",
    "fakeredis>=2.35.1",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "requires_secret: integration tests that need real cloud credentials",
    "integration: hits real Postgres (testcontainers or compose)",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/__init__.py", "app/core/telemetry.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
# N815/N818/N803/N805: API request/response models intentionally use camelCase
# to match the JSON contract (documented in docs/AIML_API_CONTRACT.md). Custom
# exceptions intentionally drop the "Error" suffix for brevity (Unauthenticated,
# MissingScope, etc.). Inner class methods use shadowed `self_*` names where
# needed for clarity in test fakes.
ignore = ["E501", "B008", "N815", "N818", "N803", "N805", "SIM105"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
